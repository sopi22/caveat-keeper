[project]
name = "caveat-keeper"
version = "0.1.0"
description = "Catches warnings that quietly disappear from project notes, by checking a repo against the rules it set for itself"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# pytest is the one dependency beyond stdlib, and it is test-only. The
# runtime package itself has zero third-party dependencies -- git history
# text comes from the `git` binary via subprocess, not a parsing library.
dev = ["pytest>=7"]

[project.scripts]
caveat-keeper = "caveat_keeper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
